[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
windows = "0.62"
windows-core = "0.62"
windows-numerics = "0.3"
nacre-core = { path = "crates/core" }
nacre-platform = { path = "crates/platform" }
nacre-ui = { path = "crates/ui" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Iterasi cepat saat pengembangan (tanpa LTO penuh): cargo build --profile fast
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16

