[package]
name = "nacre-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "abra"
path = "src/main.rs"

[dependencies]
nacre-core.workspace = true
nacre-platform.workspace = true
nacre-ui.workspace = true
windows-core.workspace = true
windows-numerics.workspace = true

[dependencies.windows]
workspace = true
features = [
  "Foundation", "Graphics", "System", "UI", "UI_Composition",
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_LibraryLoader",
  "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
  "Win32_Security", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse",
  # seret-taruh berkas ke notch (Rak)
  "Win32_System_Ole", "Win32_System_SystemServices",
]


