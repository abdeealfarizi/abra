[package]
name = "nacre-platform"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
nacre-core.workspace = true
windows-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
wmi = "0.14"

[dependencies.windows]
workspace = true
features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
  "Win32_UI_Accessibility", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Storage_Xps",
  "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Shell_Common", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_Graphics_Imaging", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Devices_Radios", "Win32_System_SystemInformation", "Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams", "Win32_System_Diagnostics_Debug", "Win32_System_Power", "Win32_NetworkManagement_WiFi",
]








